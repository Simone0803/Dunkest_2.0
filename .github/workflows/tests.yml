name: Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Smoke-test terminal entry points
        run: |
          bash -n run-backtest.sh
          python -m dunkest --help
          python -m dunkest backtest --help
          python - <<'PY'
          from pathlib import Path
          from dunkest.config import Settings
          settings = Settings.from_yaml(Path("config/backtest.example.yaml"))
          assert settings.season_id == "25"
          assert settings.season == "2025-26"
          print("Backtest configuration loaded successfully.")
          PY
      - name: Run test suite
        run: python -m pytest -q
