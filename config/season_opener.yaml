training_target: target_pdk_official
opening_multiseason_training: true
# Conservatively blend the historical PDK estimator after current-minute allocation.
historical_pdk_blend_weight: 0.20
# Preset: prima giornata NBA 2026/27, squadra nuova (95 CR, trasferimenti gratis)
season: "2026-27"
season_id: "26"
opening_prior_season_id: "25"
nba_season_start: "2026-10-20"
nba_season_end: "2027-06-30"
season_opener:
  prior_season: "2025-26"
  gameweek: 1
  budget: 95.0
  transfer_penalty: 0.0
  use_pdk_cr_proxy: false
  pdk_cr_scale: 2.75

max_player_log_entries: 0
# Risk-adjusted objective: reduce concentration in high-variance rookie forecasts.
optimizer_top_k: 3
# Capitano scelto manualmente dopo aver osservato i risultati dei turni precedenti.
optimize_captain: true
min_different_players_top_k: 1
optimizer_objective: risk_adjusted
risk_lambda: 0.10
use_injuries: true
