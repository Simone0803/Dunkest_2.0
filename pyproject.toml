[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dunkest-optimizer"
version = "0.1.0"
description = "Dunkest NBA team selection and optimization system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14",
  "httpx>=0.27",
  "tenacity>=8.2",
  "pyyaml>=6.0",
  "pulp>=2.7,<4",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "nba_api>=1.4",
  "lxml>=5.0",
  "beautifulsoup4>=4.12",
  "playwright>=1.52,<2",
  "rich>=13.7",
  "xgboost>=2.0; platform_machine != 'arm64' or sys_platform != 'darwin'",
  "lightgbm>=4.0; platform_machine != 'arm64' or sys_platform != 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "shap>=0.44"]
explore = ["matplotlib>=3.8", "jupyter>=1.0"]
model-search = ["torch>=2.14"]

[project.scripts]
dunkest = "dunkest.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
